name: Issue labels

# The issue forms collect priority and area as dropdowns. GitHub applies the
# `labels:` frontmatter automatically but cannot turn a dropdown answer into a
# label, so this workflow copies those answers onto the matching labels and
# removes them again when the answer changes.

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const managed = /^(priority|area): /
            const allowed = /^(priority: (high|medium|low)|area: (core|runtime|database|infrastructure))$/
            const body = context.payload.issue.body ?? ''
            const answers = ['Priority', 'Area']
              .map((heading) => body.match(new RegExp(`^### ${heading}\\s*\\n+([^\\n]+)`, 'm')))
              .filter(Boolean)
              .map((match) => match[1].trim())
              .filter((value) => allowed.test(value))

            if (answers.length === 0) return

            const current = context.payload.issue.labels.map((label) => label.name)
            const stale = current.filter((name) => managed.test(name) && !answers.includes(name))
            for (const name of stale) {
              await github.rest.issues
                .removeLabel({ ...context.repo, issue_number: context.issue.number, name })
                .catch(() => {})
            }

            await github.rest.issues.addLabels({
              ...context.repo,
              issue_number: context.issue.number,
              labels: answers,
            })
