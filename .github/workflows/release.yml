name: Release

# A release is cut in two steps, because `main` requires a pull request and status checks and
# semantic-release can no longer push its release commit there:
#
# 1. `Release PR` runs on every push to `main` — a promotion request merging. It asks
#    semantic-release for the next version and its release notes, writes the version bump and the
#    CHANGELOG entry onto a `release/next` branch, and opens that branch as a pull request into
#    `main`. Nothing is tagged or published yet.
# 2. `Publish` runs on a push to `main` whose `package.json` version has no `v<version>` tag yet —
#    the merge of that pull request. It tags the merge commit and creates the GitHub Release, and
#    writes nothing back to `main`, so no bypass actor is involved.
#
# `preview` no longer releases: promoting it into `main` is what starts a release, so a release
# always describes what production runs. A push to `preview` still runs the `Lint` job below —
# `preview` is unprotected, so a direct push there needs the same lint and private-overlay gates a
# pull request gets. The manual dispatch previews the next release without opening a pull request.
on:
  push:
    branches: [main, preview]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Compute the next version and release notes without opening a pull request
        type: boolean
        default: false

permissions:
  contents: read

# Never run two releases concurrently and never cancel one that is mid-flight.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Reads the app's .nvmrc so the CI runtime cannot drift from the pinned version.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: 'apps/core/.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Gate the release on the repository's own lint rules. `npm run lint` exits non-zero on
      # errors, so a lint regression fails here instead of shipping in a published release.
      - name: Lint
        run: npm run lint

      # A push straight to `preview` or `main` skips the pull-request workflow, so the private
      # overlay guard runs here too: a customer asset committed by mistake fails the run, so it is
      # never promoted into a release.
      - name: No private overlay files
        run: node apps/core/scripts/check-private-files.mjs

  release-pr:
    name: Release PR
    needs: lint
    # A push to `preview` only runs the gates above: promoting `preview` into `main` is what starts
    # a release, so the version is prepared once the promoted commit is what production runs.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # push the release/next branch
      pull-requests: write # open and update the release pull request
    steps:
      # The pull request has to be opened by an actor rather than by GITHUB_TOKEN: GitHub starts no
      # workflow for a pull request created with GITHUB_TOKEN, so the `Lint` and `Private overlay`
      # checks `main` requires would never report and the request could never merge. The token only
      # needs to push a branch and open a pull request — it does not need to bypass the protection.
      - name: Check the release token
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::error::RELEASE_TOKEN is not set. A pull request opened with GITHUB_TOKEN starts no workflow, so the checks main requires would never report; use a fine-grained PAT for an account with contents and pull-requests write. It does not need to bypass main's protection."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          # semantic-release needs the full history and all tags to find the previous release.
          fetch-depth: 0
          # Check out with the token that also opens the pull request, so the branch push and the
          # request come from the same actor.
          token: ${{ secrets.RELEASE_TOKEN }}

      # Reads the app's .nvmrc so the CI runtime cannot drift from the pinned version.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: 'apps/core/.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `package.json` carrying a version no tag points at means the release pull request already
      # merged and the `Publish` job owns this push, so there is nothing to open here.
      - name: Read the release state
        id: state
        run: node scripts/semantic-release/release-state.mjs

      # semantic-release is asked in dry-run mode, so this only computes the version and the release
      # notes; the script writes them onto `release/next` and opens it as a pull request.
      - name: Open or refresh the release pull request
        if: steps.state.outputs.pending == 'false'
        env:
          # semantic-release only analyses commits here, but it checks push access to `main` first.
          # GH_TOKEN is the actor `gh` uses to open the pull request.
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: node scripts/semantic-release/release-pr.mjs ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}

  publish:
    name: Publish
    needs: lint
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # push the tag
      issues: write # comment on issues resolved by the release
      pull-requests: write # comment on pull requests included in the release
    outputs:
      published: ${{ steps.release.outputs.published }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          # semantic-release needs the full history and all tags to find the previous release.
          fetch-depth: 0

      # Reads the app's .nvmrc so the CI runtime cannot drift from the pinned version.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: 'apps/core/.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # A version that is already on `main` without a tag is what the merge of the release pull
      # request leaves behind. Any other push has the `Release PR` job to prepare one first.
      - name: Read the release state
        id: state
        run: node scripts/semantic-release/release-state.mjs

      # Tags and the GitHub Release for them only: the manifests and CHANGELOG are already on
      # `main`, so semantic-release pushes no commit, and the workflow's own token is enough — no
      # actor with a bypass is involved. `verify-release-version` fails the run before the tag if
      # the commits analyse to a version other than the one the release pull request merged.
      - name: Publish
        id: release
        if: steps.state.outputs.pending == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx semantic-release
          echo "published=true" >> "$GITHUB_OUTPUT"

  # The release pull request merges into `main` only, so merging `main` back is what keeps `preview`
  # carrying the version and CHANGELOG it wrote — otherwise the next promotion conflicts on
  # `package.json` and the footer keeps reporting the old version.
  sync-preview:
    name: Merge main into preview
    needs: publish
    if: needs.publish.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 0
          # `preview` is not protected today, but pushing with the same token keeps the back-merge
          # working if it ever is.
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Merge
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # `preview` also takes pushes by hand, so the push below can lose a race with a commit
          # that landed after this checkout. Re-fetch and reconcile with the new tip instead of
          # failing: a red run here leaves `preview` without the version commit, and the next
          # promotion conflicts on `package.json` — the situation this job exists to prevent.
          for attempt in 1 2 3; do
            git fetch origin main preview
            if git merge-base --is-ancestor origin/main HEAD; then
              echo 'preview already contains main'
              exit 0
            fi
            # A conflict is not retryable: it fails here with nothing pushed, so `preview` is
            # never left half-merged.
            git merge --no-ff -m 'chore: merge main into preview' origin/main
            if git push origin HEAD:preview; then
              exit 0
            fi
            echo "::warning::push to preview was rejected on attempt ${attempt}, retrying from its tip"
            git reset --hard origin/preview
          done
          echo '::error::could not back-merge main into preview after 3 attempts'
          exit 1
