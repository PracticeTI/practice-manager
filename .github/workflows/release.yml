name: Release

# A push to the production branch cuts a release: semantic-release derives the version from the
# Conventional Commits since the last tag, then updates the manifests, CHANGELOG.md and tag.
# `preview` no longer releases: promoting it into `main` is what publishes a version, so a release
# always describes what production runs. A push to `preview` still runs the `Lint` job below —
# `preview` is unprotected, so a direct push there needs the same lint and private-overlay gates a
# pull request gets — but only `main` runs the `release` job. The manual dispatch exists to preview
# a release without publishing one.
on:
  push:
    branches: [main, preview]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Compute the next version and release notes without publishing a release
        type: boolean
        default: false

permissions:
  contents: read

# Never run two releases concurrently and never cancel one that is mid-flight.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Reads the app's .nvmrc so the CI runtime cannot drift from the pinned version.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: 'apps/core/.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Gate the release on the repository's own lint rules. `npm run lint` exits non-zero on
      # errors, so a lint regression fails here instead of shipping in a published release.
      - name: Lint
        run: npm run lint

      # A push straight to `preview` or `main` skips the pull-request workflow, so the private
      # overlay guard runs here too: a customer asset committed by mistake fails the run, so it is
      # never promoted into a release.
      - name: No private overlay files
        run: node apps/core/scripts/check-private-files.mjs

  release:
    name: Release
    needs: lint
    # A push to `preview` only runs the gates above: promoting `preview` into `main` is the release
    # event, so the version is tagged once the promoted commit is what production runs.
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # push the release commit and tag, create the GitHub release
      issues: write # comment on issues resolved by the release
      pull-requests: write # comment on pull requests included in the release
    steps:
      # `main` requires status checks, and a branch protection rule constrains pushes as well as
      # merges, so the version commit must be pushed by an actor that bypasses the rule. The
      # workflow's own token is not one. Check before semantic-release writes the tag and
      # manifests, so a missing token fails here instead of on a rejected push. Remove this step
      # if the GitHub Actions app is added to a ruleset's bypass list instead.
      - name: Check the release token
        if: github.event.inputs.dry_run != 'true'
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::error::RELEASE_TOKEN is not set. main is protected, so the version commit has to be pushed by an admin PAT or a GitHub App on a bypass list; the workflow's GITHUB_TOKEN cannot."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          # semantic-release needs the full history and all tags to find the previous release.
          fetch-depth: 0

      # Reads the app's .nvmrc so the CI runtime cannot drift from the pinned version.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: 'apps/core/.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Release
        env:
          # A fine-grained PAT (or GitHub App installation token) belonging to an actor that can
          # bypass `main`'s protection. See docs/developer-guide/versioning.md.
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: npx semantic-release ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}

  # The release job is the only thing that writes to `main` alone, so merging it back is what keeps
  # `preview` carrying the version and CHANGELOG the release just wrote — otherwise the next
  # promotion conflicts on `package.json` and the footer keeps reporting the old version.
  sync-preview:
    name: Merge main into preview
    needs: release
    if: needs.release.result == 'success' && github.event.inputs.dry_run != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 0
          # `preview` is not protected today, but pushing with the same token keeps the back-merge
          # working if it ever is.
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Merge
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # `preview` also takes pushes by hand, so the push below can lose a race with a commit
          # that landed after this checkout. Re-fetch and reconcile with the new tip instead of
          # failing: a red run here leaves `preview` without the version commit, and the next
          # promotion conflicts on `package.json` — the situation this job exists to prevent.
          for attempt in 1 2 3; do
            git fetch origin main preview
            if git merge-base --is-ancestor origin/main HEAD; then
              echo 'preview already contains main'
              exit 0
            fi
            # A conflict is not retryable: it fails here with nothing pushed, so `preview` is
            # never left half-merged.
            git merge --no-ff -m 'chore: merge main into preview' origin/main
            if git push origin HEAD:preview; then
              exit 0
            fi
            echo "::warning::push to preview was rejected on attempt ${attempt}, retrying from its tip"
            git reset --hard origin/preview
          done
          echo '::error::could not back-merge main into preview after 3 attempts'
          exit 1
